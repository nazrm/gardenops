version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: cron
    cronjob: 17 6,18 * * *
    timezone: Europe/Oslo
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    include: scope
  groups:
    backend-patch-minor:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - '*'
  cooldown:
    default-days: 7
    semver-major-days: 7
    semver-minor-days: 7
    semver-patch-days: 7
  open-pull-requests-limit: 5
- package-ecosystem: npm
